    description: >
      Completar debug_teleport_player(pos: Vector2):
      1. var players = get_tree().get_nodes_in_group('player')
      2. if players.is_empty(): push_warning y return
      3. players[0].global_position = pos
      4. Logging.write_event() con event='debug_teleport_player', data={'pos': str(pos)}
      El hotkey F4 llamará a debug_teleport_player(Vector2.ZERO) como teleport rápido al origen.
      Asegurarse de que player.gd llame add_to_group('player') en _ready() (ya es convención
